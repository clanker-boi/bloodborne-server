name: Modern build (server)
on:
  push:
    branches: [build/modern-toolchain-conan-docker]
    paths:
      - CMakeLists.txt
      - conanfile.py
      - server/**
      - tools/yt.py
      - docker/build/**
      - .github/workflows/build-modern.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - conanfile.py
      - server/**
      - tools/yt.py
      - docker/build/**
      - .github/workflows/build-modern.yml
  workflow_dispatch:

# Limit branch/PR duplicate noise during build migration. Group by the actual
# source branch for push and PR events, so every new commit supersedes an old job.
concurrency:
  group: modern-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  server:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang pipx python3
          pipx install 'conan>=2.31,<3'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Detect Conan build profile
        run: conan profile detect --force
      - name: Configure
        run: python3 tools/yt.py configure server
      - name: Build
        run: python3 tools/yt.py build server --jobs 4
      - name: Test
        run: python3 tools/yt.py test server --jobs 4
