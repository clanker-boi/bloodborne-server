name: Verify GHCR Conan binary snapshots
on:
  push:
    branches: [build/modern-toolchain-conan-docker]
    paths:
      - .github/workflows/verify-deps-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Conan and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pipx
          pipx install conan==2.33.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Login to GHCR with read-only package access
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore GHCR into completely clean Conan home and forbid source builds
        env:
          CACHE_IMAGE: ghcr.io/clanker-boi/yharnam-conan-cache:lock-${{ hashFiles('conanfile.py', 'conan/profiles/**', 'conan/locks/**') }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          export CONAN_HOME="$(mktemp -d)"
          docker pull "$CACHE_IMAGE"
          cid="$(docker create "$CACHE_IMAGE")"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true; rm -rf "$CONAN_HOME"' EXIT
          docker cp "$cid:/conan-cache/." "$CONAN_HOME/"
          docker rm "$cid"
          python3 tools/yt.py deps server --build-policy never
          echo "PASS: ${{ matrix.arch }} resolved locked Qt/Protobuf binaries without compiling dependencies"
